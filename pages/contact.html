<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | would love to hear from you!</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <!-- =========================
         NAVIGATION BAR
         ========================= -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="../index.html" class="nav-logo">would love to hear from you!</a>
            
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="faith.html">Faith</a></li>
                <li><a href="aviation.html">Aviation</a></li>
                <li><a href="visuals.html">Visuals</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- =========================
         CONTACT PAGE CONTENT
         ========================= -->
    <main>
        <section class="contact-container">
            
            <div class="contact-header">
                <h1>Do you love what i love?<br>Get in Touch</h1>
                <p>Have questions, thoughts, or collaboration inquiries? Reach out and connect.</p>
            </div>

            <div class="contact-grid">
                <!-- Contact Form Box -->
                <div class="contact-form-wrapper">
                    <form action="#" method="POST" class="contact-form">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" required placeholder="Enter your full name">
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" required placeholder="name@example.com">
                        </div>

                        <div class="form-group">
                            <label for="message">Your Message</label>
                            <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
                        </div>

                        <button type="submit" class="submit-btn">Send Message</button>
                    </form>
                </div>

                <!-- Image / Info Box -->
                <div class="contact-image-wrapper">
                    <img src="../images/contact-img.jpg" alt="Contact banner image">
                    <div class="contact-info-overlay">
                        <h3>Let's Connect</h3>
                        <p>Every journey begins with a conversation. We look forward to hearing from you.</p>
                    </div>
                </div>
            </div>

        </section>
    </main>

</body>
</html>
